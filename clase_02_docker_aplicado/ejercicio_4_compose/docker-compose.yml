services:
  app:
    build: .
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
    volumes:
      - .:/app   # hot reload: cambios en app.py se ven sin rebuildear la imagen

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes   # persistencia: escribe a disco
    volumes:
      - redis-data:/data

volumes:
  redis-data:
