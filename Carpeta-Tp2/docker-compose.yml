services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      TP2_WORKERS: "4"
      TP2_PROCESOS: "2"
      TP2_MAX_COLA: "1000"
      TP2_TIMEOUT: "60"
      TP2_GRACIA: "10"
      TP2_HASH_EXECUTOR: "proceso"
    volumes:
      - ./estado:/app/estado
    # Más que TP2_GRACIA: docker espera esto después del SIGTERM antes de
    # mandar SIGKILL, así el apagado ordenado llega a volcar el estado.
    stop_grace_period: 30s
